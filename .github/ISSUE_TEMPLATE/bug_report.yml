# .github/ISSUE_TEMPLATE/bug_report.yml
name: Bug report
description: Something isn't working as expected.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible — MQTT integrations are hard to debug without logs.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2024.12.1"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: 4box S Series integration version
      description: See Settings → Devices & Services → 4box S Series, or the manifest.json version.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: device-model
    attributes:
      label: Device model
      options:
        - P40S
        - M048B
        - M048C
        - M048D
        - M054F
        - M053B (dual-channel)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the integration with device ID ...
        2. Turn the switch on
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Enable debug logging first (Settings → System → Logs → search "s_series_mqtt" → Enable debug logging), reproduce the issue, then paste the relevant log lines here. Logs make MQTT issues much faster to diagnose.
      render: shell
    validations:
      required: false

  - type: textarea
    id: mqtt-traffic
    attributes:
      label: Raw MQTT traffic (optional but very useful)
      description: |
        If possible, run `mosquitto_sub -h <broker> -t '<device_id>/#' -v` while reproducing the issue and paste the output here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (broker used, network setup, other integrations interacting with the same device, etc.)
    validations:
      required: false