name: Auto Release Integration

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Force Tag Sync
        run: |
          git fetch --tags --force --prune
          git pull --tags || true

      - name: Generate Unique Version Tag
        id: vars
        run: |
          YEAR_MONTH=$(date +'%Y.%-m')
          PATCH=0

          while git ls-remote --tags origin | grep -q "refs/tags/$YEAR_MONTH.$PATCH"; do
            echo "Tag $YEAR_MONTH.$PATCH exists on remote, skipping..."
            PATCH=$((PATCH + 1))
          done

          VERSION="$YEAR_MONTH.$PATCH"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Final Version: $VERSION"

      - name: Update manifest.json Version
        run: |
          MANIFEST="custom_components/fourbox_s_series/manifest.json"
          VERSION="${{ steps.vars.outputs.tag }}"
          
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"
          echo "✅ Updated $MANIFEST to version $VERSION"

      - name: Commit & Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/fourbox_s_series/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update manifest.json to ${{ steps.vars.outputs.tag }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create Zip Package (Rooted contents)
        run: |
          # Entriamo DENTRO la cartella dell'integrazione così lo zip conterrà i file direttamente nella radice
          cd custom_components/fourbox_s_series
          zip -r ../../fourbox_s_series.zip .
          cd ../..

          if [ ! -f fourbox_s_series.zip ]; then
            echo "❌ File fourbox_s_series.zip non trovato!"
            exit 1
          fi
          echo "✅ Pacchetto fourbox_s_series.zip creato con successo."

      - name: Extract Commit Log
        id: log_summary
        run: |
          PREV_TAG="${{ steps.vars.outputs.prev_tag }}"
          
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log -n 10 --pretty=format:"* %s")
          else
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"* %s")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="* Maintenance and bug fixes."
          fi

          {
            echo 'SUMMARY<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release Notes Header
        id: body
        run: |
          {
            echo 'BODY<<EOF'
            echo "[![GitHub Downloads (specific tag)](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.vars.outputs.tag }}/total?style=for-the-badge)](https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }})"
            echo ""
            echo "### 📝 Changes in this release"
            echo "${{ steps.log_summary.outputs.SUMMARY }}"
            echo ""
            echo "### 📦 Manual Installation"
            echo "Download \`fourbox_s_series.zip\`, extract it, and copy the contents into your Home Assistant \`config/custom_components/fourbox_s_series/\` directory."
            echo ""
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body: ${{ steps.body.outputs.BODY }}
          generate_release_notes: true
          make_latest: true
          files: fourbox_s_series.zip